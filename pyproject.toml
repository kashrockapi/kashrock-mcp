[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "kashrock-mcp"
version = "0.6.6"
description = "KashRock esports MCP — full tier-scoped API for agents. Google login, then build."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "KashRock", email = "ovitalszn@gmail.com" }]
keywords = ["esports", "mcp", "model-context-protocol", "api", "cs2", "valorant", "dota", "props", "odds"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
]
dependencies = [
    "httpx>=0.26,<0.28",
    "mcp>=1.9,<2",
]

[project.urls]
Homepage = "https://www.kashrock.com/mcp"
Documentation = "https://www.kashrock.com/docs"
API = "https://kashrock.up.railway.app"
Repository = "https://github.com/kashrockapi/kashrock-mcp"

[project.scripts]
kashrock-mcp = "kashrock_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]
